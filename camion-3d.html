<style>
  html,body{margin:0;height:100%;background:#0c0c14;overflow:hidden;font-family:'Manrope',system-ui,sans-serif}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  .bar{position:absolute;left:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;max-width:calc(100% - 28px)}
  .btn{font-family:'Sora',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.4px;color:#c9ced6;background:rgba(17,17,25,.88);border:1px solid #23232f;border-radius:20px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(8px);transition:color .2s,border-color .2s,background .2s}
  .btn:hover{color:#fff;border-color:rgba(212,0,0,.6)}
  .btn.on{color:#fff;background:linear-gradient(160deg,#c00000,#900000);border-color:#d40000}
  .hint{position:absolute;left:14px;bottom:16px;pointer-events:none;font-size:.68rem;color:#62627a;letter-spacing:.3px}
  .pin{position:absolute;transform:translate(-50%,-140%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:20px;background:rgba(12,12,20,.92);border:1px solid rgba(212,0,0,.45);color:#fff;font-family:'Sora',sans-serif;font-size:.68rem;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:opacity .25s,transform .2s,border-color .2s}
  .pin:hover{border-color:#ff4444;filter:brightness(1.15)}
  .pin .dot{width:8px;height:8px;border-radius:50%;background:#ff2222;box-shadow:0 0 0 4px rgba(212,0,0,.22)}
  .pin.hidden{opacity:0;pointer-events:none}
  .toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(12,12,20,.94);border:1px solid #23232f;border-left:3px solid #d40000;color:#f0f0f8;font-size:.74rem;padding:10px 16px;border-radius:4px;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}
  /* lista de piezas del motor */
  .parts{position:absolute;right:14px;top:14px;width:224px;max-height:calc(100% - 92px);display:flex;flex-direction:column;pointer-events:auto;background:rgba(12,12,20,.9);border:1px solid #23232f;border-radius:10px;backdrop-filter:blur(10px);overflow:hidden}
  .parts h4{flex:none;margin:0;padding:11px 13px 9px;font-family:'Sora',sans-serif;font-size:.63rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#f0f0f8;border-bottom:1px solid #1e1e28;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
  .parts h4 b{font-weight:800}
  .parts h4 em{flex:none;font-style:normal;font-size:.7rem;color:#8d8da6;transition:transform .2s}
  .parts.min h4{border-bottom:0}
  .parts.min h4 em{transform:rotate(-90deg)}
  .parts.min .plist{display:none}
  .parts.min h4 span{display:none}
  @media (max-width:760px){
    .parts{width:auto;right:10px;top:10px;max-width:calc(100% - 20px);max-height:calc(100% - 130px)}
    .parts h4{padding:9px 11px;font-size:.58rem}
    .bar{left:10px;top:10px;gap:5px;max-width:calc(100% - 130px)}
    .btn{font-size:.58rem;padding:6px 10px;border-radius:14px}
    .hint{display:none}
  }
  .parts h4 span{display:block;margin-top:3px;font-size:.6rem;font-weight:600;letter-spacing:.2px;text-transform:none;color:#6a6a82}
  .prow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 13px;border:0;border-bottom:1px solid #16161f;background:transparent;color:#b9bdc8;font-family:'Manrope',sans-serif;font-size:.7rem;font-weight:600;text-align:left;cursor:pointer;transition:background .15s,color .15s}
  .prow:last-child{border-bottom:0}
  .plist{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#33333f transparent}
  .plist::-webkit-scrollbar{width:6px}
  .plist::-webkit-scrollbar-thumb{background:#33333f;border-radius:3px}
  .prow i{width:6px;height:6px;border-radius:50%;background:#3d3d4c;flex:none;transition:background .15s,box-shadow .15s}
  .prow small{display:block;font-size:.58rem;font-weight:600;letter-spacing:.3px;color:#5e5e74;text-transform:uppercase}
  .prow:hover,.prow.on{background:rgba(212,0,0,.14);color:#fff}
  .prow:hover i,.prow.on i{background:#ff2b2b;box-shadow:0 0 0 3px rgba(212,0,0,.22)}
  .tip{position:absolute;pointer-events:none;transform:translate(10px,-50%);background:rgba(12,12,20,.95);border:1px solid rgba(212,0,0,.5);color:#fff;font-family:'Sora',sans-serif;font-size:.67rem;font-weight:700;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .15s}
  .tip small{display:block;font-family:'Manrope',sans-serif;font-size:.58rem;font-weight:600;color:#ff8a8a;letter-spacing:.3px;margin-top:2px}
  .tip.show{opacity:1}
</style>

<body>
<three-d-stage name="camion-diesel" background="#0c0c14"></three-d-stage>
<div id="ui">
  <div class="bar">
    <button class="btn" data-view="tres">Vista 3/4</button>
    <button class="btn" data-view="frente">Frente</button>
    <button class="btn" data-view="lado">Lateral</button>
    <button class="btn" data-view="atras">Trasera</button>
    <button class="btn" id="btnCab">Levantar cabina</button>
    <button class="btn" id="btnSpin">Girar</button>
  </div>
  <div class="hint">Arrastra para girar · rueda para acercar · toca una pieza del motor para ver sus repuestos</div>
  <div class="parts" id="parts">
    <h4 id="partsToggle"><b>Piezas del motor<span>Toca una pieza en el 3D o en la lista</span></b><em id="partsCaret">▾</em></h4>
    <div class="plist" id="plist"></div>
  </div>
  <div class="tip" id="tip"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
if (stage.shadowRoot) {
  let tries = 0;
  const kill = () => {
    const tb = stage.shadowRoot.querySelector('.toolbar');
    const nt = stage.shadowRoot.querySelector('.note');
    if (tb) tb.remove();
    if (nt) nt.remove();
    if (!tb && ++tries < 20) setTimeout(kill, 150);
  };
  kill();
}
{
  const panel = document.getElementById('parts');
  const toggle = document.getElementById('partsToggle');
  if (window.matchMedia('(max-width:760px)').matches) panel.classList.add('min');
  toggle.addEventListener('click', () => panel.classList.toggle('min'));
}
const renderer = stage._renderer, scene = stage._scene, camera = stage._camera, controls = stage._controls;

/* ───────── render: tonemapping + estudio reflejado ───────── */
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

function studioEnv(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,512);
  grd.addColorStop(0.00,'#f4f7fb');
  grd.addColorStop(0.42,'#c2cdd9');
  grd.addColorStop(0.49,'#8b939c');
  grd.addColorStop(0.51,'#36393f');
  grd.addColorStop(1.00,'#101216');
  g.fillStyle = grd; g.fillRect(0,0,1024,512);
  const soft = (x,y,w,h,a)=>{
    const rg = g.createRadialGradient(x,y,0,x,y,Math.max(w,h)/2);
    rg.addColorStop(0,'rgba(255,255,255,'+a+')'); rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(x-w/2,y-h/2,w,h);
  };
  soft(250,110,430,270,0.95); soft(770,140,380,230,0.65); soft(512,40,980,150,0.5);
  soft(60,300,260,160,0.25); soft(930,320,240,150,0.2);
  const tex = new THREE.Texture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
  const pm = new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  const env = pm.fromEquirectangular(tex).texture;
  pm.dispose(); tex.dispose();
  return env;
}
scene.environment = studioEnv();
if ('environmentIntensity' in scene) scene.environmentIntensity = 1.15;
renderer.toneMappingExposure = 1.12;
/* las luces del visor quedan como relleno suave: el entorno hace el trabajo */
scene.traverse(o=>{
  if (o.isHemisphereLight) o.intensity = 0.30;
  else if (o.isDirectionalLight) o.intensity = o.castShadow ? 1.45 : 0.25;
  else if (o.isMesh && o.material && o.material.isShadowMaterial) o.material.opacity = 0.42;
});
/* piso mate para que el camión no flote */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(40, 72),
  new THREE.MeshStandardMaterial({ name:'piso', color:0x15161c, roughness:0.85, metalness:0.0 })
);
floor.rotation.x = -Math.PI/2; floor.position.y = -0.002; floor.receiveShadow = true;
scene.add(floor);

/* ───────── materiales ───────── */
const phys = (name,o) => new THREE.MeshPhysicalMaterial(Object.assign({ name }, o));
const std  = (name,o) => new THREE.MeshStandardMaterial(Object.assign({ name }, o));
const M = {
  cab:     phys('pintura_cabina', { color:0xf3f4f3, roughness:0.22, metalness:0.0, clearcoat:1.0, clearcoatRoughness:0.06 }),
  box:     phys('furgon_blanco',  { color:0xeff0ee, roughness:0.42, metalness:0.0, clearcoat:0.35, clearcoatRoughness:0.3 }),
  boxSide: phys('lamina_furgon',  { color:0xe9eae8, roughness:0.5,  metalness:0.02, clearcoat:0.2, clearcoatRoughness:0.4 }),
  glass:   phys('vidrio',         { color:0x0b1219, roughness:0.035, metalness:0.0, clearcoat:1.0, clearcoatRoughness:0.02, reflectivity:0.9 }),
  chrome:  std('cromo',           { color:0xe2e7ec, roughness:0.13, metalness:1.0 }),
  steel:   std('acero',           { color:0xb9c0c8, roughness:0.34, metalness:0.9 }),
  alum:    std('aluminio',        { color:0xa9b0b8, roughness:0.42, metalness:0.75 }),
  rim:     std('rin',             { color:0xb7bcc1, roughness:0.45, metalness:0.5 }),
  tire:    std('caucho',          { color:0x101014, roughness:0.95, metalness:0.0 }),
  tread:   std('banda_rodamiento',{ color:0x0b0b0e, roughness:0.98, metalness:0.0 }),
  dark:    std('plastico_negro',  { color:0x1a1a20, roughness:0.62, metalness:0.05 }),
  rubber:  std('empaque',         { color:0x0f0f13, roughness:0.85, metalness:0.0 }),
  engine:  std('bloque_motor',    { color:0x6b7380, roughness:0.48, metalness:0.55 }),
  castIron:std('fundicion',       { color:0x4d5158, roughness:0.62, metalness:0.5 }),
  brass:   std('bronce',          { color:0xb08d4a, roughness:0.3,  metalness:0.8 }),
  lamp:    phys('faro',           { color:0xcdd9e4, roughness:0.05, metalness:0.0, clearcoat:1, clearcoatRoughness:0.02 }),
  amber:   phys('direccional',    { color:0xd98b12, roughness:0.1,  metalness:0.0, clearcoat:1 }),
  red:     phys('reflectivo',     { color:0xb51616, roughness:0.2,  metalness:0.0, clearcoat:1 }),
  gasket:  std('empaque',         { color:0x8d2f22, roughness:0.72, metalness:0.05 }),
  hot:     std('punto',           { color:0xff2222, roughness:0.3,  emissive:0x8a0000 }),
};

/* ───────── helpers ───────── */
const box = (x,y,z) => new THREE.BoxGeometry(x,y,z);
const cyl = (r,h,s=28) => new THREE.CylinderGeometry(r,r,h,s);
function roundedBox(w,h,d,r){
  const s = new THREE.Shape(); const x=-w/2, y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2);
  s.lineTo(x+r,y+h); s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  s.lineTo(x,y+r); s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5);
  const g = new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:0.018,bevelThickness:0.018,bevelSegments:3,curveSegments:10});
  g.translate(0,0,-d/2); return g;
}
/* silueta lateral (x adelante, y arriba) extruida a lo ancho */
function profile(pts, depth, bevel=0.055){
  const s = new THREE.Shape();
  s.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) s.lineTo(pts[i][0],pts[i][1]);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelSize:bevel,bevelThickness:bevel,bevelSegments:4,curveSegments:10});
  g.translate(0,0,-depth/2); return g;
}
const truck = new THREE.Group(); truck.name = 'camion_diesel';
function part(parent,name,geo,mat,pos,rot,scale){
  const m = new THREE.Mesh(geo,mat); m.name = name;
  if (pos) m.position.set(pos[0],pos[1],pos[2]);
  if (rot) m.rotation.set(rot[0],rot[1],rot[2]);
  if (scale) m.scale.set(scale[0],scale[1],scale[2]);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

/* ═════════ chasis ═════════ */
const AX_F = 2.00, AX_R = -1.46;
const chassis = new THREE.Group(); chassis.name='chasis'; truck.add(chassis);
[0.44,-0.44].forEach((z,i)=>{
  part(chassis,'riel_'+(i?'der':'izq'), box(5.6,0.21,0.09), M.dark, [0.28,0.76,z]);
  part(chassis,'riel_ala_sup_'+(i?'der':'izq'), box(5.6,0.05,0.16), M.dark, [0.28,0.865,z+(i?-0.03:0.03)]);
  part(chassis,'riel_ala_inf_'+(i?'der':'izq'), box(5.6,0.05,0.16), M.dark, [0.28,0.655,z+(i?-0.03:0.03)]);
});
[2.55,1.6,0.6,-0.5,-1.9,-2.4].forEach((x,i)=>part(chassis,'travesano_'+(i+1), box(0.09,0.15,0.86), M.dark, [x,0.76,0]));
part(chassis,'tanque_combustible', cyl(0.25,1.05,28), M.alum, [0.7,0.64,-0.72], [0,0,Math.PI/2]);
part(chassis,'tanque_tapa', cyl(0.06,0.06,16), M.dark, [0.9,0.87,-0.72]);
[0.98,0.42].forEach((x,i)=>part(chassis,'correa_tanque_'+(i+1), box(0.045,0.54,0.54), M.dark, [x,0.62,-0.72]));
part(chassis,'caja_bateria', roundedBox(0.52,0.3,0.38,0.02), M.dark, [0.75,0.66,0.7]);
part(chassis,'silenciador', cyl(0.13,0.8,24), M.steel, [-0.15,0.6,0.58], [0,0,Math.PI/2]);
part(chassis,'tubo_escape_1', cyl(0.05,1.2,14), M.steel, [-1.15,0.6,0.58], [0,0,Math.PI/2]);
part(chassis,'tubo_escape_2', cyl(0.05,0.9,14), M.steel, [0.7,0.62,0.58], [0,0,Math.PI/2]);
part(chassis,'cardan', cyl(0.05,1.9,14), M.steel, [0.35,0.52,0], [0,0,Math.PI/2]);
part(chassis,'caja_cambios', roundedBox(0.66,0.36,0.38,0.04), M.castIron, [1.42,0.56,0]);
[[AX_F,'del',1.1],[AX_R,'tras',1.25]].forEach(([x,tag,len])=>{
  [0.44,-0.44].forEach((z,i)=>{
    part(chassis,'ballesta_'+tag+'_'+(i+1), box(len,0.055,0.13), M.steel, [x,0.6,z]);
    part(chassis,'ballesta2_'+tag+'_'+(i+1), box(len*0.8,0.05,0.12), M.steel, [x,0.545,z]);
    part(chassis,'ballesta3_'+tag+'_'+(i+1), box(len*0.55,0.045,0.11), M.steel, [x,0.495,z]);
    part(chassis,'grillete_'+tag+'_'+(i+1), box(0.06,0.2,0.16), M.dark, [x+len/2,0.66,z]);
    part(chassis,'amortiguador_'+tag+'_'+(i+1), cyl(0.035,0.34,12), M.dark, [x-0.16,0.72,z+(i?-0.12:0.12)], [0,0,0.22]);
  });
});
part(chassis,'eje_delantero', cyl(0.075,1.78,18), M.castIron, [AX_F,0.44,0], [Math.PI/2,0,0]);
part(chassis,'eje_trasero', cyl(0.1,1.86,18), M.castIron, [AX_R,0.44,0], [Math.PI/2,0,0]);
part(chassis,'diferencial', new THREE.SphereGeometry(0.24,26,20), M.castIron, [AX_R,0.44,0]);
part(chassis,'diferencial_pinon', cyl(0.09,0.22,16), M.castIron, [AX_R+0.2,0.46,0], [0,0,Math.PI/2]);

/* ═════════ ruedas ═════════ */
function wheel(name,x,z,width,outward){
  const g = new THREE.Group(); g.name = name;
  const R = 0.445;
  part(g,name+'_llanta', new THREE.CylinderGeometry(R,R,width,44,1,true), M.tire, [0,0,0], [Math.PI/2,0,0]);
  [1,-1].forEach((s,i)=>{
    part(g,name+'_flanco_'+(i+1), new THREE.TorusGeometry(R-0.055,0.058,14,44), M.tire, [0,0,s*(width/2-0.02)]);
    part(g,name+'_pared_'+(i+1), new THREE.RingGeometry(0.245,R-0.02,40), M.tire, [0,0,s*width/2], [0,s>0?0:Math.PI,0]);
  });
  const nb = 36;
  for (let i=0;i<nb;i++){
    const a = i/nb*Math.PI*2;
    part(g,name+'_taco_'+(i+1), box(0.042,0.022,width*0.8), M.tread,
      [Math.cos(a)*(R-0.008),Math.sin(a)*(R-0.008),0], [0,0,a]);
  }
  const face = (outward?1:-1)*(width/2+0.008);
  part(g,name+'_rin', cyl(0.25,width*0.92,34), M.rim, [0,0,0], [Math.PI/2,0,0]);
  part(g,name+'_disco', cyl(0.235,0.03,34), M.rim, [0,0,face*0.9], [Math.PI/2,0,0]);
  part(g,name+'_cubo', cyl(0.085,width+0.02,20), M.steel, [0,0,0], [Math.PI/2,0,0]);
  part(g,name+'_tapacubo', new THREE.SphereGeometry(0.072,18,12,0,Math.PI*2,0,Math.PI/2), M.chrome,
    [0,0,face*1.1], [outward?Math.PI/2:-Math.PI/2,0,0]);
  for (let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    part(g,name+'_tuerca_'+(i+1), cyl(0.026,0.045,6), M.steel, [Math.cos(a)*0.145,Math.sin(a)*0.145,face*1.05], [Math.PI/2,0,0]);
    const b = (i+0.5)/6*Math.PI*2;
    part(g,name+'_ventana_'+(i+1), cyl(0.035,0.06,14), M.dark, [Math.cos(b)*0.19,Math.sin(b)*0.19,face*0.95], [Math.PI/2,0,0]);
  }
  g.position.set(x,0.445,z);
  truck.add(g); return g;
}
const wheels = [
  wheel('rueda_del_izq', AX_F, 0.84, 0.28, true),

  { cat:'fanclutch', label:'Fan clutch y ventilador', nota:'Aspas · tolva',                cam:[2.2,1.9,2.9], tgt:[2.5,1.12,0],
    match:['fanclutch_','aspa_','tolva_ventilador'] },
  { cat:'correas',   label:'Correas y poleas',        nota:'Alternador · compresor',       cam:[2.1,1.9,2.8], tgt:[2.4,1.1,0.05],
    match:['correa_','polea_ciguenal','polea_alternador','alternador','compresor_aire'] },
  { cat:'sensores',  label:'Sensores',                nota:'MAP · temperatura · arnés',    cam:[1.55,2.1,2.75], tgt:[1.8,1.36,0.25],
    match:['sensor_','arnes_sensores'] },
  { cat:'otros',     label:'Filtros y varios',        nota:'Aceite · varilla · arranque',  cam:[1.6,2.1,2.9], tgt:[1.6,1.05,0.1],
    match:['filtro_aceite','varilla_aceite','motor_arranque'] },
];
const engineMeshes = [];
PARTS.forEach(p=>{ p.meshes = []; });
engine.traverse(o=>{
  if (!o.isMesh) return;
  const p = PARTS.find(q => q.match.some(m => o.name.startsWith(m)));
  if (!p) return;
  o.material = o.material.clone();   /* material propio: el resaltado no contagia */
  o.userData.part = p;
  p.meshes.push(o); engineMeshes.push(o);
});

/* un solo punto para la carrocería: el motor se toca directamente */
const HOTSPOTS = [
  { id:'furgon', cat:'otros', label:'Carrocería y furgón', pos:[-1.05,2.3,1.06], engine:false, off:[0,-10] },
];
const pins = new THREE.Group(); pins.name='puntos_interactivos'; truck.add(pins);
HOTSPOTS.forEach(h=>{
  const m = part(pins,'punto_'+h.id, new THREE.SphereGeometry(0.06,18,14), M.hot, h.pos);
  m.userData.hot = h; h.mesh = m;
});

/* centrar y montar */
const bb = new THREE.Box3().setFromObject(truck);
const c = bb.getCenter(new THREE.Vector3());
truck.position.set(-c.x, -bb.min.y, -c.z);
const root = new THREE.Group(); root.name='camion_diesel_cabina_adelantada';
root.add(truck);
stage.setObject(root);
floor.position.y = -0.002;
/* encuadre inicial 3/4 delantero, como la foto de referencia */
camera.position.set(5.9, 2.0, 4.4);
controls.target.set(0.9, 1.5, 0);
controls.update();

/* ───────── interacción ───────── */
const dom = renderer.domElement;
if (stage._ro) stage._ro.observe(stage);
new ResizeObserver(()=>{
  const w = stage.clientWidth||1, hh = stage.clientHeight||1;
  renderer.setSize(w,hh); camera.aspect = w/hh; camera.updateProjectionMatrix();
}).observe(stage);

const center = new THREE.Vector3(0, 1.55, 0);
const VIEWS = {
  tres:   [6.2, 3.2, 6.6],
  frente: [9.8, 2.4, 1.4],
  lado:   [0.4, 2.1, 9.4],
  atras:  [-9.2, 3.0, -2.2],
  motor:  [1.5, 2.5, 4.7],
};
let camFrom=null, camTo=null, tgtFrom=null, tgtTo=null, camT=1;
function flyTo(key, target){
  const v = VIEWS[key] || VIEWS.tres;
  flyRaw(v, (target||center).toArray ? target.toArray() : (target||center));
}
function flyRaw(camArr, tgtArr){
  camFrom = camera.position.clone(); camTo = new THREE.Vector3().fromArray(camArr);
  tgtFrom = controls.target.clone();
  tgtTo = tgtArr ? new THREE.Vector3().fromArray(tgtArr) : center.clone();
  camT = 0; controls.autoRotate = false; spinBtn.classList.remove('on');
}
const ease = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

let tilt = 0, tiltTarget = 0;
const cabBtn = document.getElementById('btnCab');
const spinBtn = document.getElementById('btnSpin');
cabBtn.addEventListener('click', ()=>{
  tiltTarget = tiltTarget > 0 ? 0 : 0.95;
  const up = tiltTarget > 0;
  cabBtn.textContent = up ? 'Bajar cabina' : 'Levantar cabina';
  cabBtn.classList.toggle('on', up);
  if (up){ flyTo('motor', new THREE.Vector3(1.9,1.35,0)); toast('Cabina levantada — toca una pieza del motor'); }
  else { selPart = null; hoverPart = null; refreshGlow(); syncRows(); }
});
spinBtn.addEventListener('click', ()=>{
  controls.autoRotate = !controls.autoRotate;
  spinBtn.classList.toggle('on', controls.autoRotate);
});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click', ()=>flyTo(b.dataset.view)));

const ui = document.getElementById('ui');
HOTSPOTS.forEach(h=>{
  const el = document.createElement('button');
  el.className = 'pin'; el.innerHTML = '<span class="dot"></span>' + h.label;
  el.addEventListener('click', ()=>pick(h));
  ui.appendChild(el); h.el = el;
});
function pick(h){
  parent.postMessage({ type:'sds-hotspot', id:h.cat || h.id, label:h.label }, '*');
  toast('Filtrando catálogo: ' + h.label);
  flyTo('atras', new THREE.Vector3(-1.0,1.9,0));
}

/* ── piezas del motor: lista, resaltado y selección ── */
const panel = document.getElementById('plist');
const tip = document.getElementById('tip');
let hoverPart = null, selPart = null;
function refreshGlow(){
  PARTS.forEach(p=>{
    const on = p === selPart || p === hoverPart;
    const hex = p === selPart ? 0xc01010 : 0x5a1008;
    p.meshes.forEach(m=>m.material.emissive.setHex(on ? hex : 0x000000));
  });
}
function syncRows(){
  PARTS.forEach(p=>p.row.classList.toggle('on', p === selPart));
}
function pickPart(p, fromList){
  selPart = p; hoverPart = null;
  refreshGlow(); syncRows();
  parent.postMessage({ type:'sds-hotspot', id:p.cat, label:p.label }, '*');
  toast('Filtrando catálogo: ' + p.label);
  if (tiltTarget === 0) { tiltTarget = 0.95; cabBtn.textContent = 'Bajar cabina'; cabBtn.classList.add('on'); }
  if (fromList && p.cam) flyRaw(p.cam, p.tgt);
}
PARTS.forEach(p=>{
  const b = document.createElement('button');
  b.className = 'prow';
  b.innerHTML = '<i></i><span>' + p.label + '<small>' + p.nota + '</small></span>';
  b.addEventListener('mouseenter', ()=>{ if (p !== selPart){ hoverPart = p; refreshGlow(); } });
  b.addEventListener('mouseleave', ()=>{ if (hoverPart === p){ hoverPart = null; refreshGlow(); } });
  b.addEventListener('click', ()=>pickPart(p, true));
  panel.appendChild(b); p.row = b;
});
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let dragged = false;
function toPointer(e){
  const r = dom.getBoundingClientRect();
  ptr.x = ((e.clientX - r.left)/r.width)*2 - 1;
  ptr.y = -((e.clientY - r.top)/r.height)*2 + 1;
}
dom.addEventListener('pointerdown', e=>{ toPointer(e); dragged = false; });
dom.addEventListener('pointermove', e=>{
  dragged = e.buttons ? true : dragged;
  toPointer(e);
  ray.setFromCamera(ptr, camera);
  const pin = ray.intersectObjects(pins.children, false)[0];
  let pmesh = null;
  if (!pin && tilt > 0.45){
    const hit = ray.intersectObjects(engineMeshes, false)[0];
    /* que no atraviese la cabina ni el chasis */
    if (hit){
      const first = ray.intersectObject(truck, true)[0];
      if (first && first.object.userData.part) pmesh = first.object;
    }
  }
  const p = pmesh ? pmesh.userData.part : null;
  if (p !== hoverPart && p !== selPart){ hoverPart = p; refreshGlow(); }
  else if (!p && hoverPart){ hoverPart = null; refreshGlow(); }
  dom.style.cursor = (pin || p) ? 'pointer' : '';
  if (p){
    tip.innerHTML = p.label + '<small>Ver repuestos ›</small>';
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
    tip.classList.add('show');
  } else tip.classList.remove('show');
});
dom.addEventListener('pointerleave', ()=>{ tip.classList.remove('show'); if (hoverPart){ hoverPart = null; refreshGlow(); } });
dom.addEventListener('pointerup', e=>{
  if (dragged) return;
  toPointer(e);
  ray.setFromCamera(ptr, camera);
  const pin = ray.intersectObjects(pins.children, false)[0];
  if (pin){ pick(pin.object.userData.hot); return; }
  if (tilt <= 0.45) return;
  const first = ray.intersectObject(truck, true)[0];
  if (first && first.object.userData.part) pickPart(first.object.userData.part, false);
});

window.addEventListener('message', ev=>{
  const d = ev.data || {};
  if (d.type !== 'sds-truck') return;
  if (d.action === 'view') flyTo(d.view);
  if (d.action === 'focus'){
    const p = PARTS.find(x=>x.cat === d.id);
    if (p){ pickPart(p, true); return; }
    const h = HOTSPOTS.find(x=>x.id === d.id);
    if (h){ flyTo('atras', new THREE.Vector3(-1.0,1.9,0)); toast(h.label); }
  }
});

/* loop: animación de cabina + proyección de etiquetas */
const v = new THREE.Vector3(), dir = new THREE.Vector3(), wp = new THREE.Vector3();
let tick = 0;
function occluded(mesh){
  mesh.getWorldPosition(wp);
  dir.copy(wp).sub(camera.position);
  const dist = dir.length();
  ray.set(camera.position, dir.normalize());
  ray.far = dist - 0.08;
  const hit = ray.intersectObject(truck, true).find(x => x.object !== mesh && x.object.visible);
  ray.far = Infinity;
  return !!hit;
}
function frame(){
  tick++;
  const now = performance.now();
  const dt = Math.min((now - (frame.t || now)) / 1000, 0.25);
  frame.t = now;
  tilt += (tiltTarget - tilt) * Math.min(1, dt * 5.5);
  cabPivot.rotation.z = -tilt;
  bayLight.intensity = Math.max(0, (tilt - 0.35)) * 9;
  if (camT < 1){
    camT = Math.min(camT + dt * 0.9, 1);
    const k = ease(camT);
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
  }
  const open = tilt > 0.45;
  const rect = dom.getBoundingClientRect();
  HOTSPOTS.forEach(h=>{
    const show = h.engine ? open : true;
    h.mesh.visible = show;
    if (show && tick % 8 === 0) h.blocked = occluded(h.mesh);
    if (!show) h.blocked = false;
    v.set(h.pos[0],h.pos[1],h.pos[2]).add(truck.position).project(camera);
    const behind = v.z > 1;
    h.el.classList.toggle('hidden', !show || behind || h.blocked);
    h.el.style.left = (rect.left + (v.x*0.5+0.5)*rect.width) + 'px';
    h.el.style.top  = (rect.top + (-v.y*0.5+0.5)*rect.height) + 'px';
    const o = h.off || [0,0];
    h.el.style.transform = 'translate(calc(-50% + '+o[0]+'px), calc(-140% + '+o[1]+'px))';
  });
}
/* un solo tick: anima, actualiza controles y dibuja. Se maneja con rAF y con
   un intervalo de respaldo, porque el visor incrustado puede pausar rAF. */
function tickAll(){
  try { frame(); } catch(e){ console.warn(e); }
  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(null);
stage._loop = tickAll;
let lastT = 0;
function rafLoop(t){ requestAnimationFrame(rafLoop); if (t - lastT > 12){ lastT = t; tickAll(); } }
requestAnimationFrame(rafLoop);
setInterval(()=>{ if (performance.now() - lastT > 60){ lastT = performance.now(); tickAll(); } }, 60);
tickAll();
setTimeout(()=>toast('Toca “Levantar cabina” para ver el motor'), 1200);
</script>
</body>
</html>
